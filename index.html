<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Restoration SDA — Renovation Fund</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100vh;
    font-family: 'Nunito', sans-serif;
    background: #0A1628;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 100% 50% at 50% 0%,   #1A3A6E 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 0%   100%, #0A2A14 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 100% 100%, #0A2A14 0%, transparent 55%),
      #0A1628;
  }
  .page {
    position: relative; z-index: 1;
    width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 14px 20px 10px;
    gap: 6px;
  }
  .title-block { flex-shrink: 0; text-align: center; line-height: 1; }
  .church-name {
    font-size: clamp(11px, 1.3vw, 16px);
    font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
    color: #FFD966; margin-bottom: 3px;
    text-shadow: 0 0 16px rgba(255,217,102,0.5);
  }
  .main-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(36px, 6.5vw, 86px);
    font-weight: 900; color: #FFFFFF;
    line-height: 1.0; letter-spacing: 2px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .main-title span {
    color: #FFD966;
    text-shadow: 0 0 40px rgba(255,217,102,0.7), 0 4px 24px rgba(0,0,0,0.6);
  }
  .gold-bar {
    width: 160px; height: 3px;
    background: linear-gradient(90deg, transparent, #FFD966, transparent);
    margin: 6px auto 0;
  }
  .thermo-area {
    flex: 1 1 0; min-height: 0;
    width: 100%;
    display: flex; align-items: stretch; justify-content: center;
  }
  #thermoSVG { width: 100%; height: 100%; display: block; }
  .bottom-bar {
    flex-shrink: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    gap: 24px; flex-wrap: wrap;
    padding: 8px 20px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,217,102,0.2);
    border-radius: 14px;
  }
  .inp-field { display: flex; align-items: center; gap: 8px; }
  .inp-field label {
    font-size: clamp(12px, 1.2vw, 15px);
    font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
    color: #FFD966; white-space: nowrap;
  }
  .inp-field input {
    padding: 7px 10px;
    border: 2px solid rgba(255,217,102,0.4); border-radius: 8px;
    font-size: clamp(15px, 1.6vw, 20px);
    font-family: 'Cinzel', serif; font-weight: 700;
    color: #0A1628; background: #FFFDF0;
    outline: none; width: 150px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .inp-field input:focus {
    border-color: #FFD966;
    box-shadow: 0 0 0 3px rgba(255,217,102,0.25);
  }
  .scripture-line {
    flex-shrink: 0;
    font-family: 'Cinzel', serif;
    font-size: clamp(11px, 1.1vw, 15px);
    font-style: italic; font-weight: 700;
    color: rgba(255,255,255,0.45); text-align: center;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-block">
    <div class="church-name">Restoration Seventh-day Adventist Church · Orlando</div>
    <div class="main-title">Church <span>Renovation</span> Fund</div>
    <div class="gold-bar"></div>
  </div>

  <div class="thermo-area">
    <!--
      ViewBox: 0 0 1100 760

      ZONES (x):
        0   – 200  : % labels, right-aligned x=192
        200 – 230  : left tick zone
        230 – 330  : left gap
        330 – 430  : TUBE (width=100)
        430 – 460  : right tick zone
        460 – 700  : $ increment labels, left-aligned x=468
        700 – 760  : gap between $ labels and raised indicator
        760 – 1100 : RAISED INDICATOR zone
                     pill right edge x=1080
                     text right-aligned x=1072
                     arrow: x1=760 → x2=432 (right edge of tube)

      Tube: x=330, y=20, width=100, height=660
      TOP    y=20  (100%)
      BOTTOM y=680 (0%)
      RANGE  660px

      Ticks every 66px (10%):
        100% y=20
         90% y=86
         80% y=152
         70% y=218
         60% y=284
         50% y=350
         40% y=416
         30% y=482
         20% y=548
         10% y=614
          0% y=680

      Bulb: cx=380 cy=728 r=46
    -->
    <svg id="thermoSVG" viewBox="0 0 1100 760"
         xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="tc">
          <rect x="330" y="20" width="100" height="660" rx="50"/>
        </clipPath>
        <linearGradient id="greenGrad" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
          <stop offset="0%"   stop-color="#063D14"/>
          <stop offset="25%"  stop-color="#0D6622"/>
          <stop offset="65%"  stop-color="#1E9E3A"/>
          <stop offset="100%" stop-color="#4CD964"/>
        </linearGradient>
        <linearGradient id="tubeBg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#C4D4BC"/>
          <stop offset="38%"  stop-color="#E6F4DE"/>
          <stop offset="100%" stop-color="#B4C8AC"/>
        </linearGradient>
        <radialGradient id="bulbGrad" cx="38%" cy="32%" r="62%">
          <stop offset="0%"   stop-color="#4CD964"/>
          <stop offset="50%"  stop-color="#1E9E3A"/>
          <stop offset="100%" stop-color="#063D14"/>
        </radialGradient>
        <!-- Arrowhead pointing LEFT (into tube from right) -->
        <marker id="arrowLeft" markerWidth="10" markerHeight="8"
                refX="1" refY="4" orient="auto">
          <polygon points="10 0, 0 4, 10 8" fill="#FFD966"/>
        </marker>
      </defs>

      <!-- ══ TUBE ══ -->
      <rect x="334" y="24" width="100" height="660" rx="50" fill="rgba(0,0,0,0.35)"/>
      <rect x="330" y="20" width="100" height="660" rx="50"
            fill="url(#tubeBg)" stroke="#2A7A40" stroke-width="3"/>
      <rect id="mercFill" x="333" y="680" width="94" height="0"
            clip-path="url(#tc)" fill="url(#greenGrad)"/>
      <rect x="344" y="26" width="18" height="648" rx="9"
            fill="rgba(255,255,255,0.32)" clip-path="url(#tc)"/>
      <rect x="330" y="20" width="100" height="660" rx="50"
            fill="none" stroke="#2A7A40" stroke-width="3"/>
      <rect id="connector" x="333" y="674" width="94" height="60"
            fill="url(#greenGrad)" opacity="0"/>

      <!-- ══ TICK MARKS ══ -->
      <!-- 100% -->
      <line x1="296" y1="20"  x2="330" y2="20"  stroke="#FFD966" stroke-width="5"/>
      <line x1="430" y1="20"  x2="464" y2="20"  stroke="#FFD966" stroke-width="5"/>
      <!-- 90% -->
      <line x1="304" y1="86"  x2="330" y2="86"  stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="86"  x2="456" y2="86"  stroke="#4CD964" stroke-width="3.5"/>
      <!-- 80% -->
      <line x1="304" y1="152" x2="330" y2="152" stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="152" x2="456" y2="152" stroke="#4CD964" stroke-width="3.5"/>
      <!-- 70% -->
      <line x1="304" y1="218" x2="330" y2="218" stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="218" x2="456" y2="218" stroke="#4CD964" stroke-width="3.5"/>
      <!-- 60% -->
      <line x1="304" y1="284" x2="330" y2="284" stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="284" x2="456" y2="284" stroke="#4CD964" stroke-width="3.5"/>
      <!-- 50% -->
      <line x1="296" y1="350" x2="330" y2="350" stroke="#FFD966" stroke-width="5"/>
      <line x1="430" y1="350" x2="464" y2="350" stroke="#FFD966" stroke-width="5"/>
      <!-- 40% -->
      <line x1="304" y1="416" x2="330" y2="416" stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="416" x2="456" y2="416" stroke="#4CD964" stroke-width="3.5"/>
      <!-- 30% -->
      <line x1="304" y1="482" x2="330" y2="482" stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="482" x2="456" y2="482" stroke="#4CD964" stroke-width="3.5"/>
      <!-- 20% -->
      <line x1="304" y1="548" x2="330" y2="548" stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="548" x2="456" y2="548" stroke="#4CD964" stroke-width="3.5"/>
      <!-- 10% -->
      <line x1="304" y1="614" x2="330" y2="614" stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="614" x2="456" y2="614" stroke="#4CD964" stroke-width="3.5"/>
      <!-- 0% -->
      <line x1="304" y1="680" x2="330" y2="680" stroke="#4CD964" stroke-width="3.5"/>
      <line x1="430" y1="680" x2="456" y2="680" stroke="#4CD964" stroke-width="3.5"/>

      <!-- Goal dashed line -->
      <line x1="292" y1="20" x2="464" y2="20"
            stroke="#FFD966" stroke-width="3" stroke-dasharray="10,6"/>

      <!-- ══ LEFT — % labels ══ -->
      <text x="288" y="20"  text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="34" font-weight="900" fill="#FFD966">100%</text>
      <text x="288" y="86"  text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">90%</text>
      <text x="288" y="152" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">80%</text>
      <text x="288" y="218" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">70%</text>
      <text x="288" y="284" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">60%</text>
      <text x="288" y="350" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="34" font-weight="900" fill="#FFD966">50%</text>
      <text x="288" y="416" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">40%</text>
      <text x="288" y="482" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">30%</text>
      <text x="288" y="548" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">20%</text>
      <text x="288" y="614" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">10%</text>
      <text x="288" y="680" text-anchor="end" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">0%</text>

      <!-- ══ RIGHT — $ increment labels (static 10% marks) ══ -->
      <text id="lbl100" x="472" y="20"  text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="34" font-weight="900" fill="#FFD966">$1,000,000</text>
      <text id="lbl90"  x="472" y="86"  text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$900,000</text>
      <text id="lbl80"  x="472" y="152" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$800,000</text>
      <text id="lbl70"  x="472" y="218" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$700,000</text>
      <text id="lbl60"  x="472" y="284" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$600,000</text>
      <text id="lbl50"  x="472" y="350" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="34" font-weight="900" fill="#FFD966">$500,000</text>
      <text id="lbl40"  x="472" y="416" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$400,000</text>
      <text id="lbl30"  x="472" y="482" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$300,000</text>
      <text id="lbl20"  x="472" y="548" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$200,000</text>
      <text id="lbl10"  x="472" y="614" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$100,000</text>
      <text id="lbl0"   x="472" y="680" text-anchor="start" dominant-baseline="middle" font-family="Nunito,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">$0</text>

      <!-- ══ BULB ══ -->
      <circle cx="383" cy="732" r="50" fill="rgba(0,0,0,0.35)"/>
      <circle cx="380" cy="728" r="50" fill="#052E0F"/>
      <circle cx="380" cy="728" r="45" fill="#0B5A1C"/>
      <circle cx="380" cy="728" r="40" fill="url(#bulbGrad)"/>
      <circle cx="364" cy="712" r="13" fill="rgba(255,255,255,0.26)"/>

      <!--
        ══ RAISED INDICATOR ══
        Sits BEYOND the $ increment labels on the far right.
        $ labels end around x=700 (longest label ~$1,000,000 ~200px wide from x=472 = ~672)
        So raised label starts at x=730 with a gap.

        Pill:  x=730, width=330, so right edge x=1060
        Text:  right-aligned x=1050, vertically centered on mercury y
        Arrow: horizontal line from x=730 LEFT to x=432 (right wall of tube)
               arrow marker points LEFT (into tube)

        Vertical: arrow and pill both animate with mercury top y.
      -->

      <!-- Raised pill background -->
      <rect id="raisedBg"
            x="730" y="652" width="340" height="52" rx="12"
            fill="rgba(6,50,18,0.95)"
            stroke="#4CD964" stroke-width="2"
            opacity="0"/>

      <!-- "RAISED" small cap label inside pill -->
      <text id="raisedCaption"
            x="742" y="665"
            dominant-baseline="middle"
            font-family="Nunito,sans-serif" font-size="18" font-weight="900"
            fill="#4CD964" letter-spacing="2"
            opacity="0">RAISED</text>

      <!-- Big raised $ amount -->
      <text id="raisedLbl"
            x="1058" y="678"
            text-anchor="end" dominant-baseline="middle"
            font-family="Nunito,sans-serif" font-size="34" font-weight="900"
            fill="#FFD966"
            opacity="0">$187,500</text>

      <!-- Arrow: from left edge of pill (x=730) pointing LEFT to tube right wall (x=432) -->
      <line id="raisedArrow"
            x1="729" y1="678" x2="434" y2="678"
            stroke="#FFD966" stroke-width="3.5"
            stroke-dasharray="8,5"
            marker-start="url(#arrowLeft)"
            opacity="0"/>

    </svg>
  </div>

  <!-- INPUT BAR -->
  <div class="bottom-bar">
    <div class="inp-field">
      <label>Goal $</label>
      <input type="number" id="goalInput" value="1000000" min="1" step="10000"/>
    </div>
    <div class="inp-field">
      <label>Raised $</label>
      <input type="number" id="raisedInput" value="400000" min="0" step="1000"/>
    </div>
    <div class="inp-field">
      <label>Donors #</label>
      <input type="number" id="donorInput" value="" min="0" placeholder="optional"
             style="padding-left:10px;"/>
    </div>
  </div>

  <div class="scripture-line">
    "Unless the Lord builds the house, the builders labor in vain." — Psalm 127:1 KJV
  </div>

</div>

<script>
  /*
    Tube TOP    y = 20
    Tube BOTTOM y = 680
    RANGE         = 660px

    Raised indicator sits to the RIGHT of the $ labels.
    Pill:   x=730, width=340, height=52
    Text:   right-aligned x=1058
    Caption: left-aligned x=742
    Arrow:  x1=729 → x2=434 (right edge of tube), marker-start points LEFT
    All three animate vertically together with the mercury top y.
  */
  const TOP    = 20;
  const BOTTOM = 680;
  const RANGE  = BOTTOM - TOP; // 660

  const PILL_H  = 52;
  const PILL_X  = 730;
  const PILL_W  = 340;
  const CAP_X   = 742;
  const TEXT_X  = 1058;
  const ARR_X1  = 729;   // left edge of pill — arrow starts here going left
  const ARR_X2  = 434;   // right wall of tube

  function fmt(n) {
    return '$' + Math.round(n).toLocaleString();
  }

  let raf = null;

  function update() {
    const goal   = Math.max(1, parseFloat(document.getElementById('goalInput').value)   || 1);
    const raised = Math.max(0, parseFloat(document.getElementById('raisedInput').value) || 0);
    const ratio  = Math.min(raised / goal, 1);

    // Update $ increment labels (right of tube)
    document.getElementById('lbl100').textContent = fmt(goal);
    document.getElementById('lbl90').textContent  = fmt(goal * 0.9);
    document.getElementById('lbl80').textContent  = fmt(goal * 0.8);
    document.getElementById('lbl70').textContent  = fmt(goal * 0.7);
    document.getElementById('lbl60').textContent  = fmt(goal * 0.6);
    document.getElementById('lbl50').textContent  = fmt(goal * 0.5);
    document.getElementById('lbl40').textContent  = fmt(goal * 0.4);
    document.getElementById('lbl30').textContent  = fmt(goal * 0.3);
    document.getElementById('lbl20').textContent  = fmt(goal * 0.2);
    document.getElementById('lbl10').textContent  = fmt(goal * 0.1);

    const targetH = Math.round(ratio * RANGE);
    const targetY = BOTTOM - targetH; // mercury top y

    const fill  = document.getElementById('mercFill');
    const conn  = document.getElementById('connector');
    const rBg   = document.getElementById('raisedBg');
    const rCap  = document.getElementById('raisedCaption');
    const rLbl  = document.getElementById('raisedLbl');
    const rArr  = document.getElementById('raisedArrow');

    const fromH = parseFloat(fill.getAttribute('height')) || 0;
    const fromY = parseFloat(fill.getAttribute('y'))      || BOTTOM;

    if (raf) cancelAnimationFrame(raf);
    let t0 = null;

    function step(ts) {
      if (!t0) t0 = ts;
      const p    = Math.min((ts - t0) / 1200, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      const h    = fromH + (targetH - fromH) * ease;
      const y    = fromY + (targetY - fromY) * ease; // mercury top y (animating)

      fill.setAttribute('height', Math.max(0, h));
      fill.setAttribute('y', y);
      conn.setAttribute('opacity', h > 8 ? '1' : '0');

      // Clamp pill center so it stays within tube bounds
      const pillCY  = Math.min(Math.max(y, TOP  + PILL_H / 2 + 4),
                                         BOTTOM - PILL_H / 2 - 4);
      const pillTop = pillCY - PILL_H / 2;

      // Pill
      rBg.setAttribute('y', pillTop);
      rBg.setAttribute('x', PILL_X);
      rBg.setAttribute('width', PILL_W);
      rBg.setAttribute('height', PILL_H);

      // Caption "RAISED" — upper part of pill
      rCap.setAttribute('y', pillTop + 16);

      // $ amount — vertically centered in pill
      rLbl.setAttribute('y', pillCY);
      rLbl.textContent = fmt(raised);

      // Arrow — horizontal, same y as pill center, going LEFT from pill to tube
      rArr.setAttribute('y1', pillCY);
      rArr.setAttribute('y2', pillCY);
      rArr.setAttribute('x1', ARR_X1);
      rArr.setAttribute('x2', ARR_X2);

      const show = raised > 0 ? '1' : '0';
      rBg.setAttribute('opacity',  raised > 0 ? '1' : '0');
      rCap.setAttribute('opacity', show);
      rLbl.setAttribute('opacity', show);
      rArr.setAttribute('opacity', show);

      if (p < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  document.getElementById('goalInput').addEventListener('input', update);
  document.getElementById('raisedInput').addEventListener('input', update);

  update();
</script>
</body>
</html>
